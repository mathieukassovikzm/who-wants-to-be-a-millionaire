<section class="result-section">
  <div class="top">
    <p>{{title}}</p>
    <p>{{birthday}}</p>
  </div>
  <div class="section-center">
    <div class="left">
      <div class="left-container">
        <img class="logo" src="./../../../assets/Logo-Qui-veut-gagner-des-millions.png" alt="QVGDM">
        <div class="infos-results" *ngIf="txtFin">
          <p *ngIf="isResultEx()">{{txtFin.resultEx}}</p>
          <p *ngIf="isResultTB()">{{txtFin.resultTb}}</p>
          <p *ngIf="isResultBN()">{{txtFin.resultBn}}</p>
          <p *ngIf="isResultPM()">{{txtFin.resultPm}}</p>
          <p *ngIf="isResultNU()">{{txtFin.resultNu}}</p>
          <p>Tu as répondu correctement à {{ nbGoodAnswers }} des 15 question</p>
          <p>Nous avons le plaisir de t'annoncer que tu as gagné {{ nbGains }}€ ainsi que le droit de recommencer!</p>
          <!-- <p>Allez tu as assez patienté... Place au cadeau !!!! </p> -->
        </div>
      </div>
    </div>
    <div class="right">
      <div class="right-container">
        <app-pyramid class="section-pyramid"></app-pyramid>
      </div>
    </div>
  </div>
</section>
