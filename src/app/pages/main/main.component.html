<app-header class="header"></app-header>
<section [class]="getMainClass()">
  <app-pyramid class="section-pyramid"></app-pyramid>
  <div class="main-section-content">
    <div class="section-logo">
      <p class="gain">{{(currentQuestion)?.gain}}€</p>
      <app-svg-circle-gain></app-svg-circle-gain>
    </div>
    <div class="section-buttons">
      <app-button [class]="classBtnAnswer()" (click)="displayAnswer()">Réponse</app-button>
      @if (showNext()) {
        <app-button [class]="classBtnNext()" (click)="nextQuestion()">Next</app-button>
      }
      @if (showResult()) {
        <app-button [class]="classBtnNext()" (click)="toResult()">Resultats</app-button>
      }
    </div>
  </div>
</section>
<app-question class="section-question"></app-question>
<app-footer class="footer"></app-footer>
