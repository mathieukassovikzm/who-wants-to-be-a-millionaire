<ul class="pyramid">
  @for (step of sQuestions() ; track step; let i = $index) {
    <li [class]="getClass(step.id)">
      <app-svg-gain class="svg-gain"></app-svg-gain>
      <div class="item-txt">
        <p class="txt-id">{{ step.id + 1}}</p>
        <app-svg-losange [class]="getClassDot(step.id)"></app-svg-losange>
        <p class="txt-gain">€{{ step.gain }}</p>
      </div>
    </li>
  }
</ul>
